name: CI/CD Build & Deploy

on:
  push:
    branches:
      - main
      - develop
      - feature/ci-cd

env:
  DOCKER_USER: lehau17
  COMPOSE_FILE: docker-compose-kong.yml

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: ✅ Checkout source
        uses: actions/checkout@v4

      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 🏗️ Build and push all services
        run: |
          docker compose -f $COMPOSE_FILE build
          docker compose -f $COMPOSE_FILE push

  deploy:
    runs-on: ubuntu-latest
    needs: build-push

    steps:
      - name: 🧾 Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: 🤝 Add VPS to known hosts
        run: ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: 🚀 Deploy to VPS
        run: |
          ssh -i ~/.ssh/id_rsa ubuntu@${{ secrets.VPS_HOST }} << 'EOF'
            cd /home/ubuntu/be/KIEN_TRUC_BACKEND

            git pull --rebase origin develop
            sudo docker-compose -f docker-compose-kong.yml pull
            sudo docker-compose -f docker-compose-kong.yml up -d \
              kong user-service postgres redis
          EOF
