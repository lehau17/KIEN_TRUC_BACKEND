_format_version: "3.0"

plugins:
  - name: rate-limiting
    config:
      minute: 10
      policy: local
  - name: cors
    config:
      origins: ["*"]
      methods: ["GET", "POST", "PUT", "PATCH", "DELETE", "OPTIONS"]
      headers: ["Authorization", "Content-Type", "Accept"]
      credentials: true
      max_age: 3600

services:
  - name: payment-service
    url: http://payment-service:5959
    routes:
      - name: get-payments
        paths: ["/api/payment"]
        methods: ["GET", "OPTIONS"]
        strip_path: false
        plugins:
          - name: rate-limiting
            config:
              minute: 10
              limit_by: ip
              policy: local
          - name: jwt
            config:
              claims_to_verify: [exp]

      - name: get-payment-by-id
        paths: ["/api/payment/[^/]+$"]
        methods: ["GET", "OPTIONS"]
        strip_path: false
        plugins:
          - name: rate-limiting
            config:
              minute: 10
              limit_by: ip
              policy: local
          - name: jwt
            config:
              claims_to_verify: [exp]

      - name: get-payments-by-user
        paths: ["/api/payment/user/[^/]+$"]
        methods: ["GET", "OPTIONS"]
        strip_path: false
        plugins:
          - name: jwt
            config:
              claims_to_verify: [exp]

      - name: get-pending-payments
        paths: ["/api/payment/user/[^/]+/pending"]
        methods: ["GET", "OPTIONS"]
        strip_path: false
        plugins:
          - name: jwt
            config:
              claims_to_verify: [exp]

      - name: confirm-payment
        paths: ["/api/payment/confirm-payment"]
        methods: ["POST", "OPTIONS"]
        strip_path: false
        plugins:
          - name: jwt
            config:
              claims_to_verify: [exp]

      - name: get-payment-intent
        paths: ["/api/payment/get-payment-intent"]
        methods: ["POST", "OPTIONS"]
        strip_path: false
        plugins:
          - name: jwt
            config:
              claims_to_verify: [exp]

      - name: export-payment
        paths: ["/api/payment/[^/]+/export"]
        methods: ["GET", "OPTIONS"]
        strip_path: false
        plugins:
          - name: jwt
            config:
              claims_to_verify: [exp]

  - name: upload-service
    url: http://upload-service:9999
    routes:
      - name: upload-files-s3
        paths: ["/api/upload/s3-multiple"]
        methods: ["POST", "OPTIONS"]
        strip_path: false

      - name: upload-file-s3
        paths: ["/api/upload/s3"]
        methods: ["POST", "OPTIONS"]
        strip_path: false

      - name: upload-file-local
        paths: ["/api/upload/local"]
        methods: ["POST", "OPTIONS"]
        strip_path: false

      - name: upload-file-mp3
        paths: ["/api/upload/mp3"]
        methods: ["POST", "OPTIONS"]
        strip_path: false

    plugins:
      - name: cors
        config:
          origins: ["*"]
          methods: ["GET", "POST", "PUT", "PATCH", "DELETE", "OPTIONS"]
          headers: ["Authorization", "Content-Type", "Accept"]
          exposed_headers: ["Authorization"]
          credentials: true
          max_age: 3600

  # --- user-service ---
  - name: user-service
    url: http://user-service:5000
    routes:
      - name: register
        paths: ["/api/auth/register"]
        strip_path: false

      - name: login
        paths: ["/api/auth/login"]
        strip_path: false
        plugins:
          - name: rate-limiting
            config:
              minute: 5
              policy: redis
              limit_by: ip
              redis:
                host: redis # hoặc IP/hostname của Redis container
                port: 6379

      - name: refresh-token
        paths: ["/api/auth/refresh-token"]
        strip_path: false
        plugins:
          - name: rate-limiting
            config:
              minute: 5
              policy: redis
              limit_by: ip
              redis:
                host: redis # hoặc IP/hostname của Redis container
                port: 6379

      - name: verify-account
        paths: ["/api/auth/verify-account"]
        strip_path: false
        plugins:
          - name: rate-limiting
            config:
              minute: 5
              policy: redis
              limit_by: ip
              redis:
                host: redis # hoặc IP/hostname của Redis container
                port: 6379

      - name: verify-change-password
        paths: ["/api/auth/verify-change-password"]
        strip_path: false

      - name: change-password
        paths: ["/api/auth/change-password"]
        methods: ["POST"]
        strip_path: false
        plugins:
          - name: jwt
            config:
              claims_to_verify: [exp]
          - name: rate-limiting
            config:
              minute: 5
              policy: redis
              limit_by: ip
              redis:
                host: redis # hoặc IP/hostname của Redis container
                port: 6379

      - name: request-change-password
        paths: ["/api/auth/request-change-password"]
        methods: ["POST"]
        strip_path: false
        plugins:
          - name: jwt
            config:
              claims_to_verify: [exp]
          - name: rate-limiting
            config:
              minute: 5
              policy: redis
              limit_by: ip
              redis:
                host: redis # hoặc IP/hostname của Redis container
                port: 6379

      - name: get-employees
        paths: ["/api/employees"]
        methods: ["GET", "OPTIONS", "POST"]
        strip_path: false
        plugins:
          - name: jwt
            config:
              claims_to_verify: [exp]

      - name: get-me
        paths: ["/api/employees/me"]
        methods: ["GET", "OPTIONS"]
        strip_path: false
        plugins:
          - name: jwt
            config:
              claims_to_verify: [exp]

      - name: update-me
        paths: ["/api/employees/me"]
        methods: ["PATCH", "OPTIONS"]
        strip_path: false
        plugins:
          - name: jwt
            config:
              claims_to_verify: [exp]

      - name: update-employee
        paths: ["~/api/employees/\\d+$"]
        methods: ["PATCH", "OPTIONS"]
        strip_path: false
        plugins:
          - name: jwt
            config:
              claims_to_verify: [exp]

      - name: delete-me
        paths: ["/api/employees/me"]
        methods: ["DELETE", "OPTIONS"]
        strip_path: false
        plugins:
          - name: jwt
            config:
              claims_to_verify: [exp]

      - name: delete-employee
        paths: ["~/api/employees/\\d+$"]
        methods: ["DELETE", "OPTIONS"]
        strip_path: false
        plugins:
          - name: jwt
            config:
              claims_to_verify: [exp]

  - name: room-service
    url: http://room-service:5001
    routes:
      - name: get-room-list
        paths: ["/api/room"]
        methods: ["GET", "OPTIONS"]
        strip_path: false

      - name: create-room
        paths: ["/api/room"]
        methods: ["POST", "OPTIONS"]
        strip_path: false

      - name: get-room-by-id
        paths: ["/api/room/[^/]+$"]
        methods: ["GET", "OPTIONS"]
        strip_path: false

      - name: update-room
        paths: ["/api/room/[^/]+$", "~/api/room/[^/]+$"]
        methods: ["PUT", "OPTIONS"]
        strip_path: false

      - name: delete-room
        paths: ["/api/room/[^/]+$"]
        methods: ["DELETE", "OPTIONS"]
        strip_path: false

      # --- Review APIs ---
      - name: create-review
        paths: ["/api/review$", "/api/review"]
        methods: ["POST", "OPTIONS"]
        strip_path: false
        plugins:
          - name: jwt
            config:
              claims_to_verify: [exp]

      - name: get-reviews-by-room
        paths: ["~/api/review/[^/]+$"]
        methods: ["GET", "OPTIONS"]
        strip_path: false

      - name: update-review
        paths: ["~/api/review/[^/]+$"]
        methods: ["PUT", "OPTIONS"]
        strip_path: false
        plugins:
          - name: jwt
            config:
              claims_to_verify: [exp]

      - name: delete-review
        paths: ["~/api/review/[^/]+$"]
        methods: ["DELETE", "OPTIONS"]
        strip_path: false
        plugins:
          - name: jwt
            config:
              claims_to_verify: [exp]

    plugins:
      - name: cors
        config:
          origins: ["*"]
          methods: ["GET", "POST", "PUT", "PATCH", "DELETE", "OPTIONS"]
          headers: ["Authorization", "Content-Type", "Accept"]
          exposed_headers: ["Authorization"]
          credentials: true
          max_age: 3600

  # --- booking-service ---
  - name: booking-service
    url: http://booking-service:8080
    routes:
      - name: create-booking
        paths: ["/api/bookings$", "/api/bookings"]
        methods: ["POST", "OPTIONS"]
        strip_path: false
        plugins:
          - name: jwt
            config:
              claims_to_verify: [exp]

      - name: get-bookings
        paths: ["/api/bookings$", "/api/bookings"]
        methods: ["GET"]
        strip_path: false
        plugins:
          - name: jwt
            config:
              claims_to_verify: [exp]

      - name: get-bookings-paged
        paths: ["/api/bookings/paged"]
        methods: ["GET", "OPTIONS"]
        strip_path: false
        plugins:
          - name: jwt
            config:
              claims_to_verify: [exp]

      - name: confirm-booking
        paths: ["~/api/bookings/[^/]+/confirm$"]
        methods: ["PUT", "OPTIONS"]
        strip_path: false
        plugins:
          - name: jwt
            config:
              claims_to_verify: [exp]

      - name: cancel-booking
        paths: ["~/api/bookings/[^/]+/cancel$"]
        methods: ["PUT", "OPTIONS"]
        strip_path: false
        plugins:
          - name: jwt
            config:
              claims_to_verify: [exp]

      - name: checkin-booking
        paths: ["~/api/bookings/[^/]+/checkin$"]
        methods: ["PUT", "OPTIONS"]
        strip_path: false
        plugins:
          - name: jwt
            config:
              claims_to_verify: [exp]

      - name: checkout-booking
        paths: ["~/api/bookings/[^/]+/checkout$"]
        methods: ["PUT", "OPTIONS"]
        strip_path: false
        plugins:
          - name: rate-limiting
            config:
              minute: 10
              limit_by: consumer
              policy: local
          - name: jwt
            config:
              claims_to_verify: [exp]

      - name: get-bookings-by-date
        paths: ["/api/bookings/by-date"]
        methods: ["GET", "OPTIONS"]
        strip_path: false
        plugins:
          - name: rate-limiting
            config:
              minute: 10
              limit_by: consumer
              policy: local
          - name: jwt
            config:
              claims_to_verify: [exp]

      - name: check-room-availability
        paths: ["/api/bookings/check-availability"]
        methods: ["GET", "OPTIONS"]
        strip_path: false
        plugins:
          - name: jwt
            config:
              claims_to_verify: [exp]

  # --- invoice-service ---
  - name: invoice-service
    url: http://invoice-service:7000
    routes:
      - name: get-invoices
        paths: ["/api/invoices$"]
        methods: ["GET", "OPTIONS"]
        strip_path: false
        plugins:
          - name: jwt
            config:
              claims_to_verify: [exp]

      - name: get-invoice-by-id
        paths: ["~/api/invoices/[^/]+$"]
        methods: ["GET", "OPTIONS"]
        strip_path: false
        plugins:
          - name: jwt
            config:
              claims_to_verify: [exp]

consumers:
  - username: api-user
    jwt_secrets:
      - key: my-key
        algorithm: HS256
        secret: sndkjbvfskdvfhjsvdfjhvsdjfhvsdkjfhvsjdhfvskdhvfkjshvdfhjk
