    port: 5673
    username: admin
    password: 1234
    virtual-host: /
    amqp:
      deserialization:
        trust:
          all: true
# Cấu hình Resilience4J Rate Limiter
resilience4j:
  ratelimiter:
    instances:
      bookingRateLimiter:
        limitForPeriod: 5
        limitRefreshPeriod: 10s
        timeoutDuration: 0
      bookingConfirmLimiter:
        limitForPeriod: 3
        limitRefreshPeriod: 15s
        timeoutDuration: 0
      bookingCheckinLimiter:
        limitForPeriod: 2
        limitRefreshPeriod: 20s
        timeoutDuration: 0
      bookingCheckoutLimiter:
        limitForPeriod: 2
        limitRefreshPeriod: 20s
        timeoutDuration: 0
      bookingPagedLimiter:
        limitForPeriod: 5
        limitRefreshPeriod: 10s
        timeoutDuration: 0
      bookingByDateLimiter:
        limitForPeriod: 5
        limitRefreshPeriod: 10s
        timeoutDuration: 0
      bookingAvailabilityLimiter:
        limitForPeriod: 5
        limitRefreshPeriod: 10s
        timeoutDuration: 0

# Cấu hình logging
logging:
  level:
    root: INFO
    io.github.resilience4j: DEBUG
    org.springframework: INFO

# Cấu hình Eureka
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true