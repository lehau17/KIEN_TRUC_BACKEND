spring:
  application:
    name: BookingService
  server:
    port: 8080
  data:
    mongodb:
      host: localhost
      port: 27017
      database: Hotels
    redis:
      host: localhost
      port: 6379
      database: 0
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
